[build-system]
# 77.0.1 is the floor for PEP 639: `license` as an SPDX expression string plus
# `license-files`. setuptools names 77.0.0 as the first supporting release, but
# that version was never published to PyPI. Building the sdist therefore needs
# Python 3.9 or newer (setuptools dropped 3.8 in 75.4.0); installing the
# published wheel is unaffected, which is what `requires-python` below governs.
requires = ["setuptools>=77.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-style"
version = "0.9.0"
description = "The Elements of Agent Style: a literature-backed English technical-prose writing ruleset for AI agents, with CLI install/enable/disable for 9 primary agent surfaces."
readme = "README.md"
# Names the oldest version CI actually runs, which through v0.4.1 it did not.
# The declared floor was >=3.8 while every workflow pinned 3.12, so the claim
# was never checked, and it was wrong: v0.4.1 raised SyntaxError when it
# imported its own RULE-B detector below 3.12, which took deterministic review
# down on 3.8 through 3.11. 3.8 reached end of life in October 2024 and is not
# in the matrix, so it is no longer claimed either.
requires-python = ">=3.9"
authors = [
    { name = "Yue Zhao", email = "fortis@usc.edu" },
]
license = "MIT AND CC-BY-4.0"
# Names the paths the bundled data/NOTICE.md already cites as its siblings. PEP
# 639 installs metadata copies under .dist-info/licenses, while the package-data
# entry below keeps those sibling references resolvable inside the installed
# package. A build-root copy is not an option worth taking: PEP 639 forbids a
# license-files glob from escaping the project directory, so it would mean a
# fourth copy of the same text in this repo and one more thing to drift.
license-files = ["agent_style/data/LICENSES/*.txt"]
keywords = ["writing", "style", "agent", "llm", "ai", "instructions", "prompt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup",
]

[project.urls]
Homepage = "https://github.com/yzhao062/agent-style"
Repository = "https://github.com/yzhao062/agent-style"
Issues = "https://github.com/yzhao062/agent-style/issues"
Changelog = "https://github.com/yzhao062/agent-style/blob/main/CHANGELOG.md"

[project.scripts]
agent-style = "agent_style.cli:main"

[tool.setuptools]
# False because package-data below enumerates every shipped file and there is no
# MANIFEST.in, so manifest-derived inclusion adds nothing. Leaving it true made
# build_py read the license-files paths out of the sdist manifest and warn that
# `agent_style.data.LICENSES` is an undeclared package. Flipping it drops that
# warning and adds or removes no payload member: the wheel keeps the same 58
# byte-identical members, and the sdist keeps the same 75 relative paths once
# its archive root is excluded, differing only in the embedded copy of this file.
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_style*"]

[tool.setuptools.package-data]
agent_style = [
    "data/RULES.md",
    "data/rule-pack-compact.md",
    "data/NOTICE.md",
    "data/tools.json",
    "data/agents/*.md",
    "data/agents/*.mdc",
    "data/agents/*/*.md",
    "data/skills/*/SKILL.md",
    "data/skills/*/references/*.md",
    "data/skills/*/references/fixture-prose/*.md",
    "data/skills/*/references/fixture-prose/*.json",
    "data/LICENSES/*.txt",
]
